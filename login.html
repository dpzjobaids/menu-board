<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domino's JobAids</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #003366, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 430px;
      background: #ffffff;
      padding: 40px 34px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 2;
    }

    .login-box h1 {
      margin: 0 0 12px;
      font-size: 36px;
      color: #003366;
      font-weight: 900;
    }

    .login-box p {
      margin: 0 0 26px;
      font-size: 18px;
      color: #444;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: 900;
      color: white;
      background: #b3202a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .login-button:hover {
      background: #9d1c25;
    }

    #netlify-identity-widget {
      z-index: 999999 !important;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Please log in to continue.</p>
    <button class="login-button" type="button" id="loginButton">Login</button>
  </div>

  <script>
    function openIdentityWidget() {
      if (!window.netlifyIdentity) {
        alert("Netlify Identity did not load. Check your internet connection or Netlify Identity settings.");
        return;
      }

      window.netlifyIdentity.open();
    }

    window.addEventListener("load", function () {
      if (!window.netlifyIdentity) {
        alert("Netlify Identity did not load.");
        return;
      }

      window.netlifyIdentity.on("init", function (user) {
        if (window.location.hash) {
          window.netlifyIdentity.open();
        }

        if (user) {
          window.location.href = "/index.html";
        }
      });

      window.netlifyIdentity.on("login", function () {
        window.location.href = "/index.html";
      });

      window.netlifyIdentity.on("logout", function () {
        window.location.href = "/login.html";
      });

      window.netlifyIdentity.init();

      document.getElementById("loginButton").addEventListener("click", function () {
        openIdentityWidget();
      });
    });
  </script>

</body>
</html>
