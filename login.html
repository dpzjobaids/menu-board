<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Domino's JobAids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    .login-box {
      text-align: center;
      background: white;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      width: min(90vw, 420px);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      margin-bottom: 24px;
      color: #555;
    }
    button {
      background: #c62828;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Please log in to continue.</p>
    <button id="loginBtn">Log In</button>
  </div>

  <script>
    netlifyIdentity.init();

    document.getElementById("loginBtn").addEventListener("click", function() {
      netlifyIdentity.open("login");
    });

    netlifyIdentity.on("login", function() {
      window.location.replace("/index.html");
    });
  </script>
</body>
</html>
