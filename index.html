<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino's JobAids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    netlifyIdentity.init();

    netlifyIdentity.on("init", function(user) {
      if (!user) {
        window.location.replace("/login.html");
      }
    });

    netlifyIdentity.on("logout", function() {
      window.location.replace("/login.html");
    });
  </script>

  <style>
    .index-grid {
      width: min(1700px, 96vw);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .index-grid .menu-card {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: clamp(2rem, 2.2vw, 3rem);
      line-height: 1.05;
      font-weight: 800;
    }

    /* Top row: 3 centered cards */
    .index-grid .menu-card:nth-child(1) { grid-column: 2 / span 3; }
    .index-grid .menu-card:nth-child(2) { grid-column: 5 / span 4; }
    .index-grid .menu-card:nth-child(3) { grid-column: 9 / span 3; }

    /* Bottom row: 4 equal cards */
    .index-grid .menu-card:nth-child(4) { grid-column: 1 / span 3; }
    .index-grid .menu-card:nth-child(5) { grid-column: 4 / span 3; }
    .index-grid .menu-card:nth-child(6) { grid-column: 7 / span 3; }
    .index-grid .menu-card:nth-child(7) { grid-column: 10 / span 3; }

    @media (max-width: 1200px) {
      .index-grid {
        width: min(1100px, 94vw);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .index-grid .menu-card,
      .index-grid .menu-card:nth-child(1),
      .index-grid .menu-card:nth-child(2),
      .index-grid .menu-card:nth-child(3),
      .index-grid .menu-card:nth-child(4),
      .index-grid .menu-card:nth-child(5),
      .index-grid .menu-card:nth-child(6),
      .index-grid .menu-card:nth-child(7) {
        grid-column: auto;
        min-height: 155px;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
      }
    }

    @media (max-width: 700px) {
      .index-grid {
        width: min(94vw, 700px);
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .index-grid .menu-card {
        min-height: 120px;
        font-size: clamp(1.5rem, 6vw, 2rem);
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <img src="guy.png" alt="Domino's mascot" class="index-logo">
    <div class="header-title">Domino's JobAids</div>
  </div>

  <main class="app-center">
    <div class="menu-grid index-grid">
      <a href="pizza.html" class="menu-card card-red">Pizza</a>
      <a href="pasta.html" class="menu-card card-red">Pasta</a>
      <a href="breadsides.html" class="menu-card card-red">Bread Sides</a>
      <a href="sandwiches.html" class="menu-card card-red">Sandwiches</a>
      <a href="chicken.html" class="menu-card card-red">Chicken</a>
      <a href="desserts.html" class="menu-card card-red">Desserts</a>
      <a href="loadedtots.html" class="menu-card card-red">Loaded Tots</a>
    </div>
  </main>

</body>
</html>
