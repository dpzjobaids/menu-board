    body {
      background: #111;
      margin: 0;
      padding: 0;
      overflow-x: hidden;

    }

    .top-wrapper {
      width: 100%;

      align-items: center;
      gap: 20px;           /* controls spacing between images */
      padding-top: 80px;   /* pushes content down a bit */
      padding-bottom: 40px;
    }

    .top-wrapper img {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }

    .back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 1.8rem;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      z-index: 999;
    }

    .back:hover {
      background: rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>

  <a href="pizzas.html" class="back">← Back</a>
