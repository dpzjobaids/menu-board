<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Specialty Pizzas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="pizzas.html" class="ui-back">← Back</a>

  <div class="header-container">
    <div class="logo"></div>
    <div class="header-title">Specialty Pizzas</div>
  </div>

  <main class="app-center">
    <div class="menu-grid" id="specialty-grid">

      <a href="philly.html" class="menu-card card-blue">
        <span class="label">Philly Steak Pizza</span>
      </a>

      <a href="honoluluhawaiian.html" class="menu-card card-blue">
        <span class="label">Honolulu Hawaiian</span>
      </a>

      <a href="spicycbr.html" class="menu-card card-blue">
        <span class="label">Spicy Chicken Bacon Ranch</span>
      </a>

      <a href="pacificveggie.html" class="menu-card card-red">
        <span class="label">Pacific Veggie</span>
      </a>

      <a href="memphisbbqchicken.html" class="menu-card card-red">
        <span class="label">Memphis BBQ Chicken</span>
      </a>

      <a href="6cheese.html" class="menu-card card-blue">
        <span class="label">Wisconsin 6 Cheese</span>
      </a>

      <a href="spinpizza.html" class="menu-card card-red">
        <span class="label">Spinach & Feta</span>
      </a>

      <a href="ult.html" class="menu-card card-blue">
        <span class="label">Ultimate Pepperoni</span>
      </a>

      <a href="meatzza.html" class="menu-card card-red">
        <span class="label">MeatZZa</span>
      </a>

      <a href="extrav.html" class="menu-card card-blue">
        <span class="label">ExtravaganZZa</span>
      </a>

      <a href="deluxe.html" class="menu-card card-red">
        <span class="label">The People's Pizza - Deluxe</span>
      </a>

    </div>
  </main>

  <!-- ===============================
       AUTOMATIC ALPHABETICAL SORTING
       =============================== -->
  <script>
    const grid = document.getElementById("specialty-grid");
    const cards = Array.from(grid.children);

    cards.sort((a, b) => {
      const textA = a.querySelector(".label").textContent.trim().toLowerCase();
      const textB = b.querySelector(".label").textContent.trim().toLowerCase();
      return textA.localeCompare(textB);
    });

    cards.forEach(card => grid.appendChild(card));
  </script>

</body>
</html>
