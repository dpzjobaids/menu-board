<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domino's JobAids</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #003366, #111827);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 40px 34px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      color: #003366;
      font-weight: 900;
    }

    p {
      margin: 0 0 26px;
      font-size: 18px;
      color: #444;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: 900;
      color: white;
      background: #b3202a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .login-button:hover {
      background: #9d1c25;
    }

    #netlify-identity-widget {
      z-index: 999999 !important;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Please log in to continue.</p>
    <button class="login-button" type="button" id="loginButton">Login</button>
  </div>

  <script>
    function clearBadIdentityFrame() {
      const frame = document.getElementById("netlify-identity-widget");

      if (frame) {
        const hash = window.location.hash || "";

        if (
          !hash.includes("invite_token") &&
          !hash.includes("confirmation_token") &&
          !hash.includes("recovery_token")
        ) {
          frame.remove();
        }
      }
    }

    function openLogin() {
      clearBadIdentityFrame();

      if (!window.netlifyIdentity) {
        alert("Netlify Identity did not load.");
        return;
      }

      window.netlifyIdentity.open("login");
    }

    window.addEventListener("load", function () {
      const loginButton = document.getElementById("loginButton");

      loginButton.addEventListener("click", function () {
        openLogin();
      });

      if (!window.netlifyIdentity) {
        alert("Netlify Identity did not load.");
        return;
      }

      const hash = window.location.hash || "";

      window.netlifyIdentity.on("init", function (user) {
        if (
          hash.includes("invite_token") ||
          hash.includes("confirmation_token") ||
          hash.includes("recovery_token")
        ) {
          setTimeout(function () {
            window.netlifyIdentity.open();
          }, 300);
        }

        if (user) {
          window.location.href = "/index.html";
        }
      });

      window.netlifyIdentity.on("login", function () {
        window.location.href = "/index.html";
      });

      window.netlifyIdentity.on("logout", function () {
        window.location.href = "/login.html";
      });

      window.netlifyIdentity.init();
    });
  </script>

</body>
</html>
