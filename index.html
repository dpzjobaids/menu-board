<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino’s Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-container">
    <div class="header-title">Domino’s Menu</div>
  </div>

  <main class="app-center" style="padding-top:20px;">

    <!-- OVERRIDE GRID ONLY ON INDEX -->
    <div class="menu-grid" 
         style="
           max-width: 1500px;
           gap: 40px;
           grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
         ">

      <a href="pizza.html" class="menu-card card-blue" 
         style="padding:45px 20px; font-size:2.3rem;">
         Pizza
      </a>

      <a href="pasta.html" class="menu-card card-red"
         style="padding:45px 20px; font-size:2.3rem;">
         Pasta
      </a>

      <a href="breadsides.html" class="menu-card card-blue"
         style="padding:45px 20px; font-size:2.3rem;">
         Bread Sides
      </a>

      <a href="sandwiches.html" class="menu-card card-red"
         style="padding:45px 20px; font-size:2.3rem;">
         Sandwiches
      </a>

      <a href="chicken.html" class="menu-card card-blue"
         style="padding:45px 20px; font-size:2.3rem;">
         Chicken
      </a>

      <a href="desserts.html" class="menu-card card-red"
         style="padding:45px 20px; font-size:2.3rem;">
         Desserts
      </a>

      <a href="loadedtots.html" class="menu-card card-blue"
         style="padding:45px 20px; font-size:2.3rem;">
         Loaded Tots
      </a>

    </div>
  </main>

  <!-- SMALL MASCOT IN BOTTOM RIGHT -->
  <img src="guy.png" class="mascot">

</body>
</html>
