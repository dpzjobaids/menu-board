<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domino's JobAids</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #003366, #111827);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 40px 34px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      color: #003366;
      font-weight: 900;
    }

    p {
      margin: 0 0 26px;
      font-size: 18px;
      color: #444;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      font-size: 22px;
      font-weight: 900;
      color: white;
      background: #b3202a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #9d1c25;
    }

    .secondary {
      background: #003366;
    }

    .secondary:hover {
      background: #00264d;
    }

    #netlify-identity-widget {
      z-index: 999999 !important;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Log in to continue.</p>

    <button id="loginBtn" type="button">Login</button>
    <button id="continueBtn" class="secondary" type="button">Continue to Menu</button>
  </div>

  <script>
    function goToMenu() {
      window.location.href = "/index.html";
    }

    window.addEventListener("load", function () {
      if (!window.netlifyIdentity) {
        alert("Netlify Identity failed to load.");
        return;
      }

      netlifyIdentity.on("login", function () {
        goToMenu();
      });

      netlifyIdentity.on("init", function (user) {
        if (user) {
          goToMenu();
        }

        if (
          window.location.hash.includes("invite_token") ||
          window.location.hash.includes("confirmation_token") ||
          window.location.hash.includes("recovery_token")
        ) {
          netlifyIdentity.open();
        }
      });

      netlifyIdentity.init();

      document.getElementById("loginBtn").addEventListener("click", function () {
        var user = netlifyIdentity.currentUser();

        if (user) {
          goToMenu();
        } else {
          netlifyIdentity.open("login");
        }
      });

      document.getElementById("continueBtn").addEventListener("click", function () {
        goToMenu();
      });
    });
  </script>

</body>
</html>
