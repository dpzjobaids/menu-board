<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domino's JobAids</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body class="login-page">

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Please log in to continue.</p>

    <button class="login-button" onclick="netlifyIdentity.open()">
      Login
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.netlifyIdentity) return;

      netlifyIdentity.on("init", function (user) {
        if (window.location.hash) {
          netlifyIdentity.open();
        }

        if (user && user.app_metadata && user.app_metadata.roles && user.app_metadata.roles.includes("authorized")) {
          window.location.href = "/index.html";
        }
      });

      netlifyIdentity.on("login", function (user) {
        if (user.app_metadata && user.app_metadata.roles && user.app_metadata.roles.includes("authorized")) {
          window.location.href = "/index.html";
        } else {
          alert("Your account is not authorized yet.");
          netlifyIdentity.logout();
        }
      });

      netlifyIdentity.init();
    });
  </script>

</body>
</html>
