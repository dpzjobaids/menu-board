<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
      text-align: center;
    }

    .login-box h1 {
      margin-bottom: 20px;
      color: #003366;
    }

    .login-btn {
      background: #b3202a;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <button class="login-btn" onclick="netlifyIdentity.open()">Login</button>
  </div>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("login", function() {
        window.location.href = "/index.html";
      });
    }
  </script>

</body>
</html>
