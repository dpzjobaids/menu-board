<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domino's JobAids</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #003366, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 38px 32px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 36px;
      color: #003366;
      margin: 0 0 12px;
    }

    p {
      font-size: 18px;
      color: #444;
      margin: 0 0 26px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #b3202a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #9f1c25;
    }

    #netlify-identity-widget {
      z-index: 999999 !important;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Domino's JobAids</h1>
    <p>Please log in to continue.</p>
    <button type="button" id="loginBtn">Login</button>
  </div>

  <script>
    function removeStuckIdentityFrames() {
      document.querySelectorAll('iframe#netlify-identity-widget').forEach(function(frame) {
        frame.remove();
      });
    }

    window.addEventListener("load", function () {
      if (!window.netlifyIdentity) {
        alert("Netlify Identity failed to load.");
        return;
      }

      const hasToken =
        window.location.hash.includes("invite_token") ||
        window.location.hash.includes("recovery_token") ||
        window.location.hash.includes("confirmation_token");

      if (!hasToken) {
        removeStuckIdentityFrames();
      }

      document.getElementById("loginBtn").addEventListener("click", function () {
        removeStuckIdentityFrames();
        netlifyIdentity.open("login");
      });

      if (hasToken) {
        setTimeout(function () {
          netlifyIdentity.open();
        }, 500);
      }

      netlifyIdentity.on("login", function (user) {
        const roles =
          user.app_metadata && user.app_metadata.roles
            ? user.app_metadata.roles
            : [];

        if (roles.includes("authorized")) {
          window.location.href = "/index.html";
        } else {
          alert("Login worked, but this account is not authorized yet.");
          netlifyIdentity.logout();
        }
      });
    });
  </script>

</body>
</html>
